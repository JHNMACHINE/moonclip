name: CI

# Only `main`. The full suite is eight container jobs — MinIO, a PyTorch build
# and a six-interpreter matrix, each compiling the extension from scratch — and
# running it on the pull request *and* again on the merge paid for it twice for
# the same code.
#
# What guards the branch instead is `checks.yml`, which is fast and runs on
# every push that is not main. The trade is deliberate and worth stating: a
# branch is no longer proven against the full matrix before it is merged, so a
# failure specific to, say, one interpreter or to the S3 backend now surfaces on
# main rather than on the pull request. `main` is what `release.yml` publishes
# from, so when that happens, fix forward promptly.
on:
  push:
    branches: [main]
  # Replay it without inventing a commit — the same reason ravex has one.
  workflow_dispatch:

# The job token only reads: nothing here pushes, tags or comments, and releases
# go out with their own PyPI and crates.io tokens.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    container:
      image: rust:1.97.1-bookworm
    steps:
      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The S3 server runs as a plain background process rather than a
      # `services:` container: a service block cannot pass the arguments the
      # server needs, and working around that means depending on how a
      # particular runner implements services. The binary is self-contained.
      #
      # **versitygw, not MinIO, since 2026-09-15.** MinIO's open-source server
      # is archived and dl.min.io answers `410 Gone` for every binary, archived
      # releases included. This step used to save that notice as
      # /usr/local/bin/minio and try to execute it. versitygw is maintained,
      # ships a static binary, and every test in tests/s3_minio.rs passed
      # against it in this same image: 19 passed, 1 ignored, as with MinIO.
      # Pinned, and fetched with `curl -f`, so the next download that turns
      # into a web page stops here instead of being run.
      #
      # The bucket is made by creating the directory before startup: the posix
      # backend serves each top-level directory under its root as a bucket, the
      # same trick MinIO allowed. The credentials keep MinIO's names because the
      # tests read them from the environment and nothing else cares.
      - name: Start the S3 server
        run: |
          set -eu
          VGW=1.8.0
          curl -sSfL -o /tmp/vgw.tgz \
            "https://github.com/versity/versitygw/releases/download/v${VGW}/versitygw_v${VGW}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/vgw.tgz -C /tmp
          install -m 0755 "/tmp/versitygw_v${VGW}_Linux_x86_64/versitygw" /usr/local/bin/versitygw
          mkdir -p /tmp/s3-data/moonclip-test
          versitygw --access minioadmin --secret minioadmin --port :9000 \
            posix /tmp/s3-data >/tmp/s3.log 2>&1 &
          for _ in $(seq 1 30); do
            # Unauthenticated, the root answers 403: any status at all means
            # the server is listening.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            if [ "$code" != "000" ]; then
              echo "versitygw is up (HTTP $code)"
              exit 0
            fi
            sleep 1
          done
          echo "versitygw did not come up:" >&2
          cat /tmp/s3.log >&2
          exit 1

      # Without these variables tests/s3_minio.rs skips itself, so a failure
      # here means the S3 backend broke — not that the environment is missing.
      # That distinction is the point of running it in CI at all: the SigV4
      # signing was verified by hand exactly once before this existed.
      - name: Rust tests
        env:
          MOONCLIP_S3_ENDPOINT: http://127.0.0.1:9000
          MOONCLIP_S3_BUCKET: moonclip-test
          MOONCLIP_S3_ACCESS_KEY: minioadmin
          MOONCLIP_S3_SECRET_KEY: minioadmin
        run: cargo test

  # The matrix job below installs no torch, so everything behind
  # `importorskip("torch")` is skipped there: the engine is covered on six
  # interpreters, the PyTorch adapter on none. That adapter is what downstream
  # users actually call, and it is where the multi-rank save flow lives, so it
  # gets one job of its own with a real torch in it.
  torch-adapter:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.90.0 --profile minimal

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and test with PyTorch
        run: |
          . "$HOME/.cargo/env"
          python -m venv /opt/venv
          export VIRTUAL_ENV=/opt/venv
          export PATH="/opt/venv/bin:$PATH"
          pip install --quiet maturin pytest
          # CPU wheels: these tests are about correctness, not throughput, and
          # the CUDA build is gigabytes of download for nothing.
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          maturin develop
          # test_multirank spawns one process per rank and talks over gloo on
          # loopback, so the runner needs no GPU and no special networking.
          pytest tests/ -v

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version release.yml ships a wheel for: a version we publish is
        # a version we test. Keep this list, the classifiers in pyproject.toml,
        # and the build list in release.yml in step with each other.
        python: ["3.11", "3.12", "3.13", "3.14"]
    container:
      # One official image per version. Each ships that interpreter with pip
      # already in it, so the job needs no Python version manager and no venv:
      # the container *is* the environment. Bookworm's own python3 is 3.11
      # only, which is why the image varies instead of the packages.
      image: python:${{ matrix.python }}-bookworm
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          # Debian bookworm packages rustc 1.63; this crate needs 1.83 (see
          # rust-version in Cargo.toml), so the toolchain comes from rustup.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.90.0 --profile minimal

      # Not shallow, and the checkout is allowed to fail the job. `--depth 1`
      # fetches only the default branch's tip, so a pull request's own commit is
      # not in the clone: the checkout died with "unable to read tree", `|| true`
      # swallowed it, and the job tested main instead. Every PR check was a
      # green tick for code nobody had built.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and test on Python ${{ matrix.python }}
        run: |
          . "$HOME/.cargo/env"
          python --version
          # maturin develop refuses to install into a bare interpreter — it
          # needs VIRTUAL_ENV or CONDA_PREFIX even inside a container. The
          # stdlib venv module seeds pip on its own, so this stays pip-only.
          python -m venv /opt/venv
          export VIRTUAL_ENV=/opt/venv
          export PATH="/opt/venv/bin:$PATH"
          pip install --quiet maturin pytest
          maturin develop
          pytest tests/ -v
