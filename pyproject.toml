[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "revolver-ckpt"
version = "1.1.0"
description = "High-performance ML checkpoint management — per-tensor delta tracking, Rust-native compression, rank-aware distributed saves"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jonathan Vecchione", email = "jonathan@minya.ai"},
]
readme = "README.md"
keywords = ["checkpointing", "machine-learning", "deep-learning", "pytorch", "distributed", "delta-compression", "fsdp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://codeberg.org/JHNMACHINE/revolver"
Repository = "https://codeberg.org/JHNMACHINE/revolver"
Issues = "https://codeberg.org/JHNMACHINE/revolver/issues"

[project.optional-dependencies]
torch = ["torch>=2.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "revolver.revolver"

[tool.pytest.ini_options]
testpaths = ["tests"]
