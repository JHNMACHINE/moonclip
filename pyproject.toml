[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "moonclip"
version = "0.0.9"
description = "High-performance ML checkpoint management — per-tensor delta tracking, Rust-native compression, rank-aware distributed saves"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jonathan Vecchione", email = "jonathan@minya.ai"},
]
readme = "README.md"
keywords = ["checkpointing", "machine-learning", "deep-learning", "pytorch", "distributed", "delta-compression", "fsdp"]
classifiers = [
    # 4, not 5. The version number is 0.0.x, the format version of the pack is
    # still allowed to move, and PyPI shows this string on the project page —
    # "Production/Stable" next to a 0.0.x is a claim the release cannot support.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://codeberg.org/JHNMACHINE/moonclip"
Repository = "https://codeberg.org/JHNMACHINE/moonclip"
Issues = "https://codeberg.org/JHNMACHINE/moonclip/issues"
# PyPI shows these as "Project links", which is where someone deciding whether
# to upgrade goes looking. A relative link in the README would not do: PyPI does
# not resolve relative paths against the repository.
Changelog = "https://codeberg.org/JHNMACHINE/moonclip/src/branch/main/CHANGELOG.md"

[project.optional-dependencies]
torch = ["torch>=2.0"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "moonclip.moonclip"
# Every 0.0.4 wheel shipped a `__pycache__/` full of cp314 `.pyc` files: they
# were built from a working tree where the test suite had already run, and
# maturin copies whatever sits under `python-source`. Harmless but wrong —
# bytecode compiled for one interpreter, inside wheels for six. The release
# workflow clones fresh so it cannot happen there; this is the guard for
# everything built by hand.
exclude = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]