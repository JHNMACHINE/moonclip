[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "moonclip"
version = "0.0.4"
description = "High-performance ML checkpoint management — per-tensor delta tracking, Rust-native compression, rank-aware distributed saves"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jonathan Vecchione", email = "jonathan@minya.ai"},
]
readme = "README.md"
keywords = ["checkpointing", "machine-learning", "deep-learning", "pytorch", "distributed", "delta-compression", "fsdp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://codeberg.org/JHNMACHINE/moonclip"
Repository = "https://codeberg.org/JHNMACHINE/moonclip"
Issues = "https://codeberg.org/JHNMACHINE/moonclip/issues"
# PyPI shows these as "Project links", which is where someone deciding whether
# to upgrade goes looking. A relative link in the README would not do: PyPI does
# not resolve relative paths against the repository.
Changelog = "https://codeberg.org/JHNMACHINE/moonclip/src/branch/main/CHANGELOG.md"

[project.optional-dependencies]
torch = ["torch>=2.0"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "moonclip.moonclip"

[tool.pytest.ini_options]
testpaths = ["tests"]