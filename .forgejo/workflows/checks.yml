name: Checks

# The branch guard. `ci.yml` runs the full matrix and only on main, so this is
# what stands between a broken branch and a merge — it has to be quick enough
# that it is never the reason to skip a push, and honest enough to be worth
# looking at.
#
# One job, one container, no MinIO and no interpreter matrix: `cargo test`
# covers the library and its 177 tests in seconds, and clippy covers the rest.
# What it deliberately does *not* cover is what needs a real environment — the
# S3 backend against MinIO, the PyTorch adapter, and Python 3.11 through 3.14.
# Those wait for main.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: codeberg-small
    container:
      # Matches ci.yml. Bump both together.
      image: rust:1.97.1-bookworm
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq git

      # Not shallow, and the checkout is allowed to fail the job — the same
      # reasoning as ci.yml: `--depth 1` fetches only the default branch's tip,
      # so the pushed commit is not in the clone and the job silently tests
      # main instead. A green tick for code nobody built is worse than no tick.
      - name: Checkout
        run: |
          set -eu
          git clone ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }}

      - name: Clippy
        run: |
          set -eu
          rustup component add clippy
          # `-D warnings` so a new lint fails the branch rather than scrolling
          # past. One allowance remains:
          #
          #   too_many_arguments  MoonclipManager::new takes 24 — it is the
          #                       Python constructor, and every argument is a
          #                       documented keyword.
          #
          # Anything not on this list is a real finding and stops the push.
          #
          # `type_complexity`, `unnecessary_sort_by` and `manual_checked_ops`
          # used to be here as well. The last two only exist from clippy 1.97,
          # which this container did not have, so they were listed against a
          # toolchain that could not raise them; all three findings are fixed
          # and the lines are gone with them.
          #
          # `-A unknown-lints` stays, and is now the only thing keeping this
          # readable across a toolchain change: naming a lint an older clippy
          # does not know is `error[E0602]`, which `-D warnings` turns into a
          # hard failure. This job had never passed for exactly that reason.
          # What it costs is that a misspelled lint name above is ignored
          # rather than reported.
          cargo clippy --all-targets --features python -- \
            -D warnings \
            -A unknown-lints \
            -A clippy::too_many_arguments

      # Last, because a compile error should be reported by clippy above with a
      # better message than a bare test failure — and split in two so that when
      # something does go red, the step name already says whether it was the
      # build or the tests. Compiling first also keeps the test step's log to
      # test output instead of a wall of rustc.
      - name: Build the test binaries
        run: |
          set -eu
          cargo test --no-run --lib --tests

      - name: Rust tests
        run: |
          set -eu
          cargo test --lib --tests

      # No bench target here, deliberately. This used to be `--all-targets`,
      # which does not just build `delta_bench` — it runs it: `harness = false`
      # means cargo executes the binary's `main` rather than probing it for test
      # cases, and that main walks three 256 MB buffers five times. The branch
      # guard was spending most of its budget measuring memory bandwidth, in a
      # debug build, and reporting the result as a test pass. The timings now
      # live in `bench.yml`, on main.
      #
      # Nothing is lost by not building it here: the clippy step above passes
      # `--all-targets`, so a change to `delta` that leaves the bench
      # uncompilable still fails this job — with a better message, and without
      # codegen.
