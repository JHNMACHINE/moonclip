name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: codeberg-small
    container:
      # The PyPA manylinux image ships every supported CPython under
      # /opt/python/cp3XX-cp3XX/bin/, each with pip. That removes the need for
      # a Python version manager entirely, and — unlike building on plain
      # bookworm — the wheels come out tagged manylinux_2_28 instead of
      # linux_x86_64, which is the difference between installable and not.
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.90.0 --profile minimal

      - name: Checkout
        run: |
          git clone --depth 1 --branch ${{ forgejo.ref_name }} ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .

      # One native wheel per interpreter rather than a single abi3 wheel: the
      # stable ABI would cost PyO3's fast paths, which is the wrong trade for
      # this library. Built in one job so the shared dependencies compile once.
      - name: Build wheels
        run: |
          set -eu
          . "$HOME/.cargo/env"
          VERSIONS="cp39 cp310 cp311 cp312 cp313 cp314"

          INTERPRETERS=""
          for v in $VERSIONS; do
            py="/opt/python/$v-$v/bin/python"
            test -x "$py" || { echo "Interpreter missing: $py" >&2; exit 1; }
            INTERPRETERS="$INTERPRETERS $py"
          done

          /opt/python/cp312-cp312/bin/pip install --quiet maturin twine
          PATH="/opt/python/cp312-cp312/bin:$PATH"
          export PATH

          echo "Building for:$INTERPRETERS"
          maturin build --release --interpreter $INTERPRETERS

          echo "=== Built wheels ==="
          ls -la target/wheels/

          # Assert one wheel per version by ABI tag. A plain count would pass
          # if every wheel targeted the same interpreter, which is exactly the
          # failure this build has to rule out.
          for v in $VERSIONS; do
            if ! ls target/wheels/ | grep -q "$v"; then
              echo "No wheel built for $v" >&2
              exit 1
            fi
          done

      # The tag is what someone installs; the version inside the wheel is what
      # pip believes. A mismatch publishes a release nobody asked for, and it
      # cannot be taken back — PyPI and crates.io both refuse to reuse a
      # version number. So this is checked before anything is uploaded.
      - name: Tag must match the package version
        run: |
          set -eu
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          PY_VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          TAG="${{ forgejo.ref_name }}"
          echo "Cargo.toml $VERSION, pyproject.toml $PY_VERSION, tag $TAG"
          if [ "$VERSION" != "$PY_VERSION" ]; then
            echo "Cargo.toml and pyproject.toml disagree" >&2
            exit 1
          fi
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match version $VERSION" >&2
            exit 1
          fi

      - name: Check the artifacts
        run: /opt/python/cp312-cp312/bin/twine check target/wheels/*.whl

      # PyPI and crates.io only. Codeberg Packages used to get a copy of the
      # same wheels, which bought nothing: identical bytes at an address almost
      # nobody would point pip at, and a second token to keep alive.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -eu
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "PYPI_TOKEN is not set: a tag was pushed but nothing would" >&2
            echo "reach PyPI. Add the secret, or remove this step on purpose." >&2
            exit 1
          fi
          /opt/python/cp312-cp312/bin/twine upload target/wheels/*.whl

      # The crate, which is the half of this project that has no wheel. The
      # verification build compiles without `extension-module`, so it does not
      # need a Python interpreter to link against.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          . "$HOME/.cargo/env"
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set: the wheels went out but the" >&2
            echo "crate would not. Add the secret, or remove this step." >&2
            exit 1
          fi
          cargo publish --locked
