name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: codeberg-small
    container:
      # The PyPA manylinux image ships every supported CPython under
      # /opt/python/cp3XX-cp3XX/bin/, each with pip. That removes the need for
      # a Python version manager entirely, and — unlike building on plain
      # bookworm — the wheels come out tagged manylinux_2_28 instead of
      # linux_x86_64, which is the difference between installable and not.
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.90.0 --profile minimal

      # Full history on purpose: the check below has to prove the tagged commit
      # is on main, and a shallow clone cannot answer that question.
      - name: Checkout
        run: |
          git clone --branch ${{ forgejo.ref_name }} ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .

      # A tag can be pushed from any commit in the repository, including one on
      # a branch that was never reviewed or merged. Publishing is the one action
      # here that cannot be undone — PyPI and crates.io both refuse to reuse a
      # version number — so the tag has to name a commit that reached main.
      - name: Tag must be on main
        run: |
          set -eu
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${{ forgejo.ref_name }} points at $(git rev-parse --short HEAD)," >&2
            echo "which is not reachable from main. Merge the branch first, then" >&2
            echo "tag the merge commit. Nothing has been published." >&2
            exit 1
          fi
          echo "$(git rev-parse --short HEAD) is on main"

      # Moved ahead of the build: it costs a `grep` and rules out the mistake
      # that cannot be undone. Building six wheels first only delays the news.
      - name: Tag must match the package version
        run: |
          set -eu
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          PY_VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          TAG="${{ forgejo.ref_name }}"
          echo "Cargo.toml $VERSION, pyproject.toml $PY_VERSION, tag $TAG"
          if [ "$VERSION" != "$PY_VERSION" ]; then
            echo "Cargo.toml and pyproject.toml disagree" >&2
            exit 1
          fi
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match version $VERSION" >&2
            exit 1
          fi

      # Both secrets, before either upload. Discovering the second one is
      # missing *after* the first index has accepted its artifact is how a
      # version number gets half-published, and neither registry lets you retry
      # it: the release would have to become 0.0.5 for one half only.
      - name: Both publish tokens must be present
        env:
          PYPI_TOKEN: ${{ secrets.MOONCLIP_PYPI_TOKEN }}
          CARGO_TOKEN: ${{ secrets.MOONCLIP_CARGO_TOKEN }}
        run: |
          set -eu
          missing=""
          [ -n "${PYPI_TOKEN:-}" ] || missing="$missing MOONCLIP_PYPI_TOKEN"
          [ -n "${CARGO_TOKEN:-}" ] || missing="$missing MOONCLIP_CARGO_TOKEN"
          if [ -n "$missing" ]; then
            echo "Missing secret(s):$missing" >&2
            echo "A tag was pushed but this release would only go out halfway." >&2
            echo "Add them on the repository, delete the tag and push it again." >&2
            exit 1
          fi
          echo "both tokens present"

      # The deepest validation available without publishing: it builds the
      # package tarball and compiles it, so an `exclude` that drops a file the
      # crate needs fails here rather than after the wheels are already public.
      # Two minutes to buy that.
      - name: Dry-run the crate
        run: |
          set -eu
          . "$HOME/.cargo/env"
          cargo publish --dry-run --locked

      # One native wheel per interpreter rather than a single abi3 wheel: the
      # stable ABI would cost PyO3's fast paths, which is the wrong trade for
      # this library. Built in one job so the shared dependencies compile once.
      - name: Build wheels
        run: |
          set -eu
          . "$HOME/.cargo/env"
          VERSIONS="cp39 cp310 cp311 cp312 cp313 cp314"

          INTERPRETERS=""
          for v in $VERSIONS; do
            py="/opt/python/$v-$v/bin/python"
            test -x "$py" || { echo "Interpreter missing: $py" >&2; exit 1; }
            INTERPRETERS="$INTERPRETERS $py"
          done

          /opt/python/cp312-cp312/bin/pip install --quiet maturin twine
          PATH="/opt/python/cp312-cp312/bin:$PATH"
          export PATH

          echo "Building for:$INTERPRETERS"
          maturin build --release --interpreter $INTERPRETERS

          echo "=== Built wheels ==="
          ls -la target/wheels/

          # Assert one wheel per version by ABI tag. A plain count would pass
          # if every wheel targeted the same interpreter, which is exactly the
          # failure this build has to rule out.
          for v in $VERSIONS; do
            if ! ls target/wheels/ | grep -q "$v"; then
              echo "No wheel built for $v" >&2
              exit 1
            fi
          done

      - name: Check the artifacts
        run: /opt/python/cp312-cp312/bin/twine check target/wheels/*.whl

      # ── from here on, nothing is reversible ──────────────────────────────
      #
      # PyPI and crates.io only. Codeberg Packages used to get a copy of the same
      # wheels, which bought nothing: identical bytes at an address almost nobody
      # would point pip at, and a second token to keep alive.
      #
      # The crate goes first, and the order is a decision rather than an
      # accident. Neither artifact depends on the other — the wheel carries the
      # compiled extension and never fetches the crate — so what the order buys
      # is which half you are left holding if the job dies in between. `cargo
      # publish` is the step with more ways to fail (name, token scope,
      # verification build, metadata), so it goes where a failure still costs
      # nothing: with the wheels not yet uploaded, the version number is free on
      # both indexes and the same tag can be pushed again.
      - name: Publish to crates.io
        env:
          # Left name: what cargo itself reads. Right name: the Codeberg secret.
          CARGO_REGISTRY_TOKEN: ${{ secrets.MOONCLIP_CARGO_TOKEN }}
        run: |
          set -eu
          . "$HOME/.cargo/env"
          cargo publish --locked

      # If this fails, the crate is out and the wheels are not: `pip install
      # moonclip` finds nothing and `ravex[moonclip]` stays unsatisfiable, while
      # 0.0.x is spent on crates.io. Recovery is a new patch version for the
      # wheels — which is why every check that could have prevented it ran
      # before either upload.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MOONCLIP_PYPI_TOKEN }}
        run: |
          set -eu
          /opt/python/cp312-cp312/bin/twine upload target/wheels/*.whl
