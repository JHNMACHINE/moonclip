name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: codeberg-tiny
    steps:
      - name: Install system deps
        run: |
          apt-get update -qq && apt-get install -y -qq curl git python3 python3-pip python3-venv build-essential pkg-config libssl-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout
        run: git clone --depth 1 https://codeberg.org/JHNMACHINE/revolver.git . && git checkout $GITHUB_SHA || true

      - name: Setup Python
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -r requirements.txt

      - name: Rust tests
        run: |
          . "$HOME/.cargo/env"
          cargo test --release

      - name: Build Python module
        run: |
          . "$HOME/.cargo/env"
          export VIRTUAL_ENV=/opt/venv
          export PATH="/opt/venv/bin:$PATH"
          maturin develop --release

      - name: Python tests
        run: /opt/venv/bin/pytest tests/ -v