name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: codeberg-small
    container:
      image: rust:1.90-bookworm
    steps:
      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq git

      - name: Checkout
        run: |
          git clone --depth 1 ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }} || true

      - name: Rust tests
        run: cargo test

  # The matrix job below installs no torch, so everything behind
  # `importorskip("torch")` is skipped there: the engine is covered on six
  # interpreters, the PyTorch adapter on none. That adapter is what downstream
  # users actually call, and it is where the multi-rank save flow lives, so it
  # gets one job of its own with a real torch in it.
  torch-adapter:
    runs-on: codeberg-small
    container:
      image: python:3.12-bookworm
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.90.0 --profile minimal

      - name: Checkout
        run: |
          git clone --depth 1 ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }} || true

      - name: Build and test with PyTorch
        run: |
          . "$HOME/.cargo/env"
          python -m venv /opt/venv
          export VIRTUAL_ENV=/opt/venv
          export PATH="/opt/venv/bin:$PATH"
          pip install --quiet maturin pytest
          # CPU wheels: these tests are about correctness, not throughput, and
          # the CUDA build is gigabytes of download for nothing.
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          maturin develop
          # test_multirank spawns one process per rank and talks over gloo on
          # loopback, so the runner needs no GPU and no special networking.
          pytest tests/ -v

  python:
    runs-on: codeberg-small
    strategy:
      fail-fast: false
      matrix:
        # Every version release.yml ships a wheel for: a version we publish is
        # a version we test. Keep this list, the classifiers in pyproject.toml,
        # and the build list in release.yml in step with each other.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    container:
      # One official image per version. Each ships that interpreter with pip
      # already in it, so the job needs no Python version manager and no venv:
      # the container *is* the environment. Bookworm's own python3 is 3.11
      # only, which is why the image varies instead of the packages.
      image: python:${{ matrix.python }}-bookworm
    steps:
      - name: Install git and Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git build-essential
          # Debian bookworm packages rustc 1.63; this crate needs 1.83 (see
          # rust-version in Cargo.toml), so the toolchain comes from rustup.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.90.0 --profile minimal

      - name: Checkout
        run: |
          git clone --depth 1 ${{ forgejo.server_url }}/${{ forgejo.repository }}.git .
          git checkout ${{ forgejo.sha }} || true

      - name: Build and test on Python ${{ matrix.python }}
        run: |
          . "$HOME/.cargo/env"
          python --version
          # maturin develop refuses to install into a bare interpreter — it
          # needs VIRTUAL_ENV or CONDA_PREFIX even inside a container. The
          # stdlib venv module seeds pip on its own, so this stays pip-only.
          python -m venv /opt/venv
          export VIRTUAL_ENV=/opt/venv
          export PATH="/opt/venv/bin:$PATH"
          pip install --quiet maturin pytest
          maturin develop
          pytest tests/ -v
