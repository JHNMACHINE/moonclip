[package]
name = "moonclip"
version = "0.1.2"
edition = "2021"
# Set by pyo3 0.29, the highest MSRV among the dependencies. Declared so a
# toolchain that is too old fails with that message instead of an unrelated
# error from deep inside a dependency.
rust-version = "1.83"
description = "High-performance checkpoint management for ML training"
license = "Apache-2.0"
repository = "https://codeberg.org/JHNMACHINE/moonclip"
readme = "README.md"

# What crates.io distributes is the Rust library. The Python package, its
# tests and the Python benchmarks travel in the wheel instead, and shipping
# them here did more than waste space: `cargo publish` refused to verify the
# tarball, because running the build inside the packaged copy left
# `__pycache__` directories behind and cargo reads that as a build script
# modifying the source tree.
#
# `benches/delta_bench.rs` and `tests/s3_minio.rs` are Rust and stay.
exclude = [
    "python/**",
    "bench/**",
    "bench_baseline/**",
    "examples/**",
    "tests/*.py",
    "tests/*.sh",
    ".forgejo/**",
    "**/__pycache__/**",
]

[lib]
name = "moonclip"
# rlib so the engine can be used from other Rust projects, cdylib for the
# Python extension module.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# PyO3 bindings. Off by default so `cargo build` and `cargo test` produce a
# plain Rust library with no Python linkage.
python = ["dep:pyo3"]
# What maturin builds with: links the bindings as a Python extension module.
# Kept separate from `python` because enabling extension-module breaks
# linking for test and example binaries.
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"      # Required for S3 AWS SigV4 signing only
hmac = "0.12"       # Required for S3 AWS SigV4 signing only
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rayon = "1.8"
walkdir = "2"
tempfile = "3"
ureq = "2"
hex = "0.4"

[[bench]]
name = "delta_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
