[package]
name = "revolver"
version = "1.1.0"
edition = "2021"
description = "High-performance checkpoint management for ML training"
license = "Apache-2.0"
repository = "https://codeberg.org/JHNMACHINE/revolver"

[lib]
name = "revolver"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zstd = "0.13"
sha2 = "0.10"
hmac = "0.12"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rayon = "1.8"
memmap2 = "0.9"
walkdir = "2"
tempfile = "3"
ureq = "2"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
