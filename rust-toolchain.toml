# The toolchain this repository is developed and tested against.
#
# It exists because local and CI diverged silently, and the divergence was
# discovered the wrong way round: the crate was green in CI and red locally on
# four clippy findings, none of them a regression. CI pinned 1.90, the machine
# doing the work ran 1.97, and nothing anywhere said the two were different —
# so a red `cargo clippy` did not mean "you broke something" and a green CI did
# not mean "the next image bump will pass".
#
# Keep this in step with the `image:` in `.github/workflows/*.yml`. Those pin
# the same version and are what actually runs the gate; this makes a
# contributor's rustup agree with it rather than find out later.
#
# The patch number is not decoration. Inside `rust:1.98.1-bookworm` the
# installed toolchain is named `1.98.1-x86_64-unknown-linux-gnu`, so a
# `channel = "1.98"` here does not match it: rustup syncs the 1.98 channel and
# downloads a second copy of the same compiler, on every job of every workflow.
# Measured in that container: 31s and four components against 1.4s. Both the
# image tag and this line carry the patch version so they cannot drift apart.
#
# **This is not the MSRV.** `rust-version` in Cargo.toml says 1.83, and that is
# a claim about what a *consumer* of the published crate needs — a
# rust-toolchain.toml only applies inside this directory, so it does not raise
# the floor for anyone depending on moonclip. It does mean nothing verifies the
# 1.83 claim any more: CI compiles on 1.98 and would not notice code that needs
# it. Bumping `rust-version` or adding an MSRV job are both reasonable answers;
# neither has been done.
#
# The cost of this file is that anyone building here downloads this exact
# toolchain. That is the trade: a required download against two versions
# disagreeing without saying so.
# **Install clippy with the toolchain, not after it.** `components` below makes
# rustup add clippy the first time cargo runs here if the install did not
# include it - and under `pip install`, maturin starts cargo more than once at
# a time, so two proxies race to add the same component and one fails with
# "detected conflict: bin/cargo-clippy". On GitHub that failed two of four
# matrix jobs with identical configuration. Every rustup line in this
# repository therefore passes `--profile minimal --component clippy`.
#
[toolchain]
channel = "1.98.1"
components = ["clippy"]
